events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        least_conn;
        server app:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Limit maximum request body size to 2MB
        client_max_body_size 2M;

        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # Gatekeeper Ingress Header Sanitization:
            # Strip client-spoofed headers and attach genuine client IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Internal secret shared between Nginx Gatekeeper and Express backend
            proxy_set_header X-Gatekeeper-Secret "cbs-local-gatekeeper-secret";

            # Proxy buffer settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
    }
}
