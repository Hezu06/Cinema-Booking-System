# ===== DEVELOPMENT OVERRIDE CONFIG =====
# Chạy: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder

    environment:
      NODE_ENV: development
      DEBUG: "cinema-booking:*"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}

    ports:
      - "5000:5000"
      - "9229:9229"  # Node debugger

    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./generated:/app/generated

    command: sh -c "npx prisma generate && npm run dev"

  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cinema_booking
      MYSQL_USER: cbs
      MYSQL_PASSWORD: cbs_password
